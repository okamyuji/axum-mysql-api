[package]
name = "axum-mysql-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "derive"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tracing = "0.1"
sha2 = "0.10"
subtle = "2"

tracing-subscriber = "0.3"

[dev-dependencies]
testcontainers = "0.28"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
